name: tests
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          coverage: none
      - run: composer require --dev "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/pint --test

  core-without-laravel:
    # The core must install and run with no framework packages present.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.3'
          coverage: none
      - run: composer install --no-dev --no-interaction --no-progress
      - name: Run the core only
        run: |
          php -r 'require "vendor/autoload.php"; exit((new IntrAgile\HungarianWorkdays\Calendar())->isWorkday(new DateTimeImmutable("2026-03-16")) ? 0 : 1);'

  schedule-coverage:
    # Weekly alarm: from 31 October the bundled data must cover the next year. Runs only on the
    # weekly schedule (or by hand), so an overdue decree does not block ordinary pushes.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.3'
          coverage: none
      - run: php bin/check-coverage.php
